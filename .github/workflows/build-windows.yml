name: Build DailyBook Windows Installer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            windows/requirements-build.txt

      - name: Install project and build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt
          python -m pip install -r windows/requirements-build.txt

      - name: Run tests
        shell: pwsh
        run: python -m pytest -q

      - name: Install Inno Setup on the GitHub runner
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build Windows executables and installer
        shell: pwsh
        run: |
          $iscc = Get-ChildItem -Path "${env:ProgramFiles(x86)}\Inno Setup 6", "${env:ProgramFiles}\Inno Setup 6" -Filter ISCC.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $iscc) {
            throw "Inno Setup compiler was not found on the GitHub Actions runner."
          }
          & ".\installer\build_installer.ps1" -Clean -InnoSetup $iscc.FullName

      - name: Verify installer output
        shell: pwsh
        run: |
          $setup = Join-Path $env:GITHUB_WORKSPACE "installer\output\DailyBook-Setup-x64.exe"
          if (-not (Test-Path -LiteralPath $setup)) {
            throw "Expected installer was not created: $setup"
          }
          Get-Item -LiteralPath $setup | Select-Object FullName, Length, LastWriteTime
          Get-FileHash -LiteralPath $setup -Algorithm SHA256

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: DailyBook-Setup-x64
          path: installer/output/DailyBook-Setup-x64.exe
          if-no-files-found: error
          retention-days: 14
