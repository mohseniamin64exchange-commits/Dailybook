name: Build Windows installer

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            windows/requirements-build.txt

      - name: Install dependencies
        run: python -m pip install -r windows/requirements-build.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Package DailyBook server
        shell: pwsh
        run: .\installer\build_installer.ps1 -Clean -UseCurrentPython -SkipTests -Stage Server

      - name: Package DailyBook launcher
        shell: pwsh
        run: .\installer\build_installer.ps1 -UseCurrentPython -SkipTests -Stage Launcher

      - name: Prepare Windows service
        shell: pwsh
        run: .\installer\build_installer.ps1 -UseCurrentPython -SkipTests -Stage Service

      - name: Build installer on GitHub Actions
        shell: pwsh
        run: |
          $inno = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $inno)) { $inno = "C:\Program Files\Inno Setup 6\ISCC.exe" }
          if (-not (Test-Path $inno)) { throw "Inno Setup was not found." }
          .\installer\build_installer.ps1 -UseCurrentPython -SkipTests -Stage Installer -InnoSetup $inno

      - name: Publish installer error
        if: steps.build_installer.outcome == 'failure'
        shell: pwsh
        run: |
          $details = Get-Content .\installer\build-error.txt -Raw
          Add-Content $env:GITHUB_STEP_SUMMARY "## Installer build error"
          Add-Content $env:GITHUB_STEP_SUMMARY $details
          Write-Output "::error title=Installer build error::$details"
          exit 1

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: DailyBook-Windows-installer
          path: installer/output/DailyBook-Setup-x64.exe
          if-no-files-found: error
          retention-days: 14

