{% extends 'admin/base.html' %}{% block content %}<section class="admin-page"><div class="page-hero"><div><span class="page-kicker">امنیت اطلاعات</span><h1>بکاپ و بازیابی</h1><p>مسیر نگهداری نسخه‌های پشتیبان و پشتیبان‌گیری روزانه را مدیریت کنید.</p></div><span class="page-hero-icon">◉</span></div><div class="admin-two-col"><section class="card admin-card"><div class="card-title-row"><div><h2>تنظیمات پشتیبان‌گیری</h2><p>مسیر پیش‌فرض: <span dir="ltr">{{ default_path }}</span></p></div></div><form method="post" class="stack-form"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input type="hidden" name="action" value="save-settings"><div class="field"><label for="backup-path">مسیر بکاپ</label><input id="backup-path" name="backup_path" value="{{ setting.backup_path or default_path }}"></div><label class="toggle-row" for="auto-backup"><span><strong>بکاپ روزانه</strong><small>تهیه خودکار نسخه پشتیبان روزانه</small></span><input id="auto-backup" type="checkbox" name="auto_backup_enabled" {% if setting.auto_backup_enabled %}checked{% endif %}></label><button class="btn wide-btn">ذخیره تنظیمات</button></form></section><section class="card admin-card action-card"><div class="action-card-icon">◉</div><h2>بکاپ دستی</h2><p>همین حالا یک نسخه پشتیبان از اطلاعات برنامه تهیه کنید.</p><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input type="hidden" name="action" value="manual"><input type="hidden" name="backup_path" value="{{ setting.backup_path or default_path }}"><button class="btn gold-btn wide-btn">تهیه بکاپ دستی</button></form></section></div></section>{% endblock %}
