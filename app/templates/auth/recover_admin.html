{% extends "auth/_layout.html" %}
{% block title %}بازیابی رمز عبور{% endblock %}
{% block content %}
<h1>بازیابی رمز عبور ادمین</h1>
<p class="auth-help">رمز جدید ادمین اصلی را وارد و دوباره تأیید کنید.</p>
<form method="post" novalidate>
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label for="password">رمز جدید</label>
  <input id="password" name="password" type="password" minlength="8" required autocomplete="new-password">
  <label for="confirm_password">تکرار رمز جدید</label>
  <input id="confirm_password" name="confirm_password" type="password" minlength="8" required autocomplete="new-password">
  <button type="submit">ثبت رمز جدید</button>
  <a class="auth-back-link" href="{{ url_for('auth.login') }}">بازگشت به ورود</a>
</form>
{% endblock %}
