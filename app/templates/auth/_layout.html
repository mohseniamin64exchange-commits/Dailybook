<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{% block title %}دفتر دیجیتال روزانه{% endblock %}</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:32px 16px;background:radial-gradient(circle at 50% 10%,#f9fbfd 0,#edf3f8 48%,#e4ecf3 100%);color:#18334d;font-family:Tahoma,Arial,sans-serif;direction:rtl}.box{width:min(520px,100%);padding:34px 38px;background:#fff;border:1px solid #cbd8e3;border-radius:22px;box-shadow:0 18px 55px #19324b20}.auth-brand{text-align:center;margin-bottom:20px}.auth-brand-mark{font-size:36px}.auth-brand strong{display:block;font-size:1.12rem;margin-top:5px}h1{font-size:1.65rem;text-align:center;margin:0 0 8px;color:#102d49}.muted{text-align:center;color:#718397;font-size:.9rem;margin:0 0 26px;line-height:1.8}label{display:block;margin:15px 0 7px;font-size:.9rem;font-weight:700;color:#334e68}input{width:100%;height:50px;padding:0 14px;border:1.5px solid #b8c8d7;background:#f9fbfd;border-radius:11px;font-size:1rem;direction:rtl;outline:none;transition:.2s}input:focus{border-color:#2877d4;box-shadow:0 0 0 3px #2877d41c;background:#fff}input[type=submit],button{width:100%;height:52px;margin-top:24px;border:0;border-radius:11px;background:linear-gradient(90deg,#1769c7,#2587ee);color:#fff;font-size:1rem;font-weight:700;cursor:pointer;box-shadow:0 8px 20px #1769c72e}.errors{color:#b42318;font-size:.8rem;margin:5px 2px}.flash{padding:10px 13px;border:1px solid currentColor;border-radius:9px;margin-bottom:12px;background:#fff1f0;color:#b42318}.flash.success{background:#ecfdf3;color:#067647}.setup-note{display:flex;gap:8px;align-items:center;justify-content:center;margin-top:18px;color:#8292a3;font-size:.8rem}@media(max-width:560px){.box{padding:26px 20px;border-radius:17px}}
</style></head><body><main class="box"><div class="auth-brand"><div class="auth-brand-mark">📒</div><strong>دفتر دیجیتال روزانه</strong></div>{% with messages=get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<div class="flash {{ category }}">{{ message }}</div>{% endfor %}{% endwith %}{% block content %}{% endblock %}</main></body></html>
