<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}دفتر روزانه{% endblock %}</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#e7edf2;color:#243447;font-family:Tahoma,Arial,sans-serif;direction:rtl}.box{width:min(440px,calc(100% - 28px));margin:7vh auto;padding:28px;background:#e6ebef;border:2px solid #91a1af;border-radius:14px;box-shadow:0 8px 28px #19324b28}h1{font-size:1.35rem;text-align:center;margin:0 0 22px}label{display:block;margin:14px 0 6px;font-size:.92rem}input{width:100%;padding:11px;border:2px solid #91a1af;background:#f0f3f5;border-radius:8px;font-size:1rem;direction:rtl}button{width:100%;margin-top:22px;padding:12px;border:2px solid #1f5caf;border-radius:8px;background:#246bce;color:#fff;font-size:1rem;cursor:pointer}.errors{color:#b42318;font-size:.82rem;margin:5px 0}.flash{padding:10px;border:2px solid currentColor;border-radius:8px;margin-bottom:12px;background:#f3dfde;color:#b42318}.flash.success{background:#dcefe3;color:#067647}.muted{text-align:center;color:#526174;font-size:.85rem;margin-top:16px}
  </style>
</head>
<body><main class="box">{% with messages=get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<div class="flash {{ category }}">{{ message }}</div>{% endfor %}{% endwith %}{% block content %}{% endblock %}</main></body>
</html>
